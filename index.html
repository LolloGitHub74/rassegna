<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rassegna</title>
<meta name="description" content="Rassegna quotidiana di notizie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rassegna">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1b1f24; --muted:#5d6670; --line:#e4e0d6;
  --accent:#b8322a; --chip:#eef2f7; --chip-ink:#1f3a5f; --upd:#a35d00; --upd-bg:#fff3df;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171c; --card:#1c2027; --ink:#e9ecef; --muted:#9aa3ad; --line:#2a3039;
    --accent:#ff6b5e; --chip:#243042; --chip-ink:#c7d7ec; --upd:#ffb85c; --upd-bg:#3a2a12; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:12px 16px 10px;padding-top:calc(12px + env(safe-area-inset-top))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:720px;margin:0 auto}
h1{font-family:Georgia,"Times New Roman",serif;font-size:26px;margin:0;letter-spacing:-.3px}
h1 span{color:var(--accent)}
.nav{display:flex;align-items:center;gap:6px}
.nav button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
  width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.date{max-width:720px;margin:4px auto 0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:720px;margin:10px auto 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;font-size:13px;padding:5px 11px;border-radius:999px;
  background:var(--chip);color:var(--chip-ink);white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:8px 16px 40px}
section{scroll-margin-top:150px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);
  margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.item{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;margin:0 0 10px}
.item:active{transform:scale(.99)}
.item h3{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.3;margin:0 0 6px}
.item p{margin:0 0 8px;color:var(--ink);opacity:.88;font-size:15px}
.meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.upd{background:var(--upd-bg);color:var(--upd);font-weight:600;border-radius:6px;padding:1px 7px;font-size:11.5px}
.empty{color:var(--muted);font-style:italic;padding:4px 2px 8px}
.state{color:var(--muted);text-align:center;padding:60px 0}
footer{max-width:720px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Rassegna<span>.</span></h1>
    <div class="nav">
      <button id="prev" aria-label="Edizione precedente">‹</button>
      <button id="next" aria-label="Edizione successiva">›</button>
    </div>
  </div>
  <div class="date" id="date">&nbsp;</div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"><div class="state">Caricamento…</div></main>
<footer id="foot"></footer>
<script>
(function(){
  var dates=[], idx=0;
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function safeUrl(u){return /^https:\/\//i.test(u||'')?u:'#'}
  function fmtDate(d){
    try{var p=d.split('-');var dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2],12));
      var s=dt.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Rome'});
      return s.charAt(0).toUpperCase()+s.slice(1);}catch(e){return d}
  }
  function fmtTime(iso){try{return new Date(iso).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Rome'})}catch(e){return ''}}
  function getJSON(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
  function render(doc){
    $('date').textContent=fmtDate(doc.date);
    var secs=doc.sections||[], html='', tabs='';
    secs.forEach(function(s){
      tabs+='<a href="#s-'+esc(s.key)+'">'+esc(s.title)+'</a>';
      html+='<section id="s-'+esc(s.key)+'"><h2>'+esc(s.title)+'</h2>';
      var items=s.items||[];
      if(!items.length) html+='<div class="empty">Nessuna novità rilevante oggi.</div>';
      items.forEach(function(it){
        html+='<a class="item" href="'+esc(safeUrl(it.url))+'" target="_blank" rel="noopener">'+
          '<h3>'+esc(it.title)+'</h3><p>'+esc(it.summary)+'</p>'+
          '<div class="meta">'+(it.update?'<span class="upd">Aggiornamento</span>':'')+'<span>'+esc(it.source)+'</span></div></a>';
      });
      html+='</section>';
    });
    $('tabs').innerHTML=tabs; $('main').innerHTML=html;
    $('foot').textContent=doc.updatedAt?('Aggiornata alle '+fmtTime(doc.updatedAt)):'';
    $('prev').disabled=idx>=dates.length-1; $('next').disabled=idx<=0;
    window.scrollTo(0,0);
  }
  function load(i){
    idx=i; $('main').innerHTML='<div class="state">Caricamento…</div>';
    getJSON('data/'+dates[i]+'.json').then(render).catch(function(){
      $('main').innerHTML='<div class="state">Edizione non disponibile offline.</div>';
    });
  }
  $('prev').onclick=function(){if(idx<dates.length-1)load(idx+1)};
  $('next').onclick=function(){if(idx>0)load(idx-1)};
  getJSON('data/index.json').then(function(d){
    dates=(d.dates||[]).slice().sort().reverse();
    if(!dates.length){$('main').innerHTML='<div class="state">Nessuna edizione ancora.</div>';return}
    load(0);
  }).catch(function(){$('main').innerHTML='<div class="state">Impossibile caricare la rassegna. Controlla la connessione.</div>'});
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
